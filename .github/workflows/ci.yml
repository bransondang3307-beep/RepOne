# CI for every pull request and for main. Mirrors the local checks in AGENTS.md §3 step 5.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the RO-019 loop run CI on its own fix commits (pushes made with GITHUB_TOKEN
  # do not trigger pull_request workflows).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundaries, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # SQLite tests use the built-in node:sqlite
          cache: npm
      - run: npm ci
      - name: Module boundaries (when the checker exists on this branch)
        run: npm run check:boundaries --if-present
      - run: npm run typecheck
      - run: npm test
      - name: AI loop policy and logic tests (when present on this branch)
        run: |
          if [ -d .github/ai-loop/tests ]; then node --test ".github/ai-loop/tests/*.test.cjs"; else echo "no AI loop tests on this branch"; fi

  handoff:
    name: Handoff file present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a docs/handoffs entry (AGENTS.md §3 step 6)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" == *"[no-handoff]"* ]]; then
            echo "Handoff check skipped: [no-handoff] in PR title."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'docs/handoffs/')
          if echo "$changed" | grep -Eq '^docs/handoffs/[0-9]{4}-[0-9]{2}-[0-9]{2}-.+\.md$'; then
            echo "Handoff found:"; echo "$changed"
          else
            echo "::error::Add docs/handoffs/YYYY-MM-DD-<agent>-<TASK-ID>.md (see docs/handoffs/TEMPLATE.md), or put [no-handoff] in the PR title for trivial changes."
            exit 1
          fi
