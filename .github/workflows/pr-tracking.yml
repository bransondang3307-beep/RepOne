name: PR tracking

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  group: pr-tracking-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: PR handoff snapshot
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test scripts/pr-handoff.test.mjs
      - run: node scripts/pr-handoff.mjs
