# RO-019 · Automated Claude Code ↔ Codex loop — step 2: Claude fixes blocking Codex findings.
#
# Dispatched by the Codex review workflow (or manually by the owner) with the id of the bot's
# review comment. Every input is re-validated against GitHub state; the loop stops after
# MAX_FIX_ROUNDS (2) attempts per PR. OFF BY DEFAULT — see ai-codex-review.yml header and
# docs/automation/claude-codex-loop.md.
#
# Job isolation:
#   gate        read-only, no secrets              — eligibility, round cap, stale-review check
#   claude      ANTHROPIC_API_KEY, read-only token — Claude edits files only (no shell, no network tools)
#   verify-fix  runs PR code, read-only, no secrets — patch policy + npm ci && npm run verify
#   push        contents:write, runs NO PR code     — git apply, commit, push to the PR branch (never main, never force)
#   report      PR write + dispatch, no secrets     — comment, labels, re-review / CI dispatch
# The automation never merges.
name: AI loop · Claude fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (branch must start with the loop prefix, default `claude/`)
        required: true
        type: string
      review_comment_id:
        description: Id of the loop bot's Codex review comment to address
        required: true
        type: string
      dry_run:
        description: Dry run — Claude is not called and nothing is pushed
        type: boolean
        default: true
      chain:
        description: After a successful push, dispatch a Codex re-review
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ai-loop-fix-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (eligibility; read-only, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      default_branch: ${{ steps.gate.outputs.default_branch }}
      round: ${{ steps.gate.outputs.round }}
      dry_run: ${{ steps.gate.outputs.dry_run }}
      chain: ${{ steps.gate.outputs.chain }}
      review_comment_id: ${{ steps.gate.outputs.review_comment_id }}
      review_comment_url: ${{ steps.gate.outputs.review_comment_url }}
      handoff_path: ${{ steps.gate.outputs.handoff_path }}
      branch_prefix: ${{ steps.gate.outputs.branch_prefix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: trusted
          sparse-checkout: .github/ai-loop
          persist-credentials: false
      - name: Evaluate eligibility
        id: gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          AI_LOOP_MODE: ${{ vars.AI_LOOP_MODE }}
          AI_LOOP_ALLOWED_ACTORS: ${{ vars.AI_LOOP_ALLOWED_ACTORS }}
          AI_LOOP_BRANCH_PREFIX: ${{ vars.AI_LOOP_BRANCH_PREFIX }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CHAIN: ${{ inputs.chain }}
          AI_LOOP_OUT_DIR: ${{ runner.temp }}/ai-loop-findings
        with:
          script: |
            const { fixGate } = require(`${process.env.GITHUB_WORKSPACE}/trusted/.github/ai-loop/gate.cjs`);
            await fixGate({ github, context, core });
      - name: Upload findings
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-loop-findings
          path: ${{ runner.temp }}/ai-loop-findings
          retention-days: 7

  claude:
    name: Claude fix (ANTHROPIC_API_KEY; file tools only, read-only token)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out trusted default-branch files at the workspace root (CLAUDE.md, AGENTS.md, loop scripts)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Check out PR head into pr-head/
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr-head
          persist-credentials: false
      - name: Remove git metadata from the PR copy (Claude gets plain files)
        run: rm -rf pr-head/.git
      # Claude Code lazily loads CLAUDE.md / .claude settings from subdirectories it reads, so
      # PR-controlled agent configuration is moved outside the workspace while Claude runs and
      # restored before packaging (edits to these paths are rejected by the patch policy anyway).
      - name: Hold PR-controlled agent configuration outside the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/held"
          cd pr-head
          find . \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .claude -o -name .claude.json -o -name .mcp.json \) -prune -print0 |
            while IFS= read -r -d '' p; do mkdir -p "$RUNNER_TEMP/held/$(dirname "$p")"; mv "$p" "$RUNNER_TEMP/held/$p"; done
          find "$RUNNER_TEMP/held" -mindepth 1 | sed "s#^$RUNNER_TEMP/held/##" || true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-loop-findings
          path: ai-loop-input
      - name: Build prompt
        id: prompt
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          ROUND: ${{ needs.gate.outputs.round }}
          HANDOFF_PATH: ${{ needs.gate.outputs.handoff_path }}
        run: |
          mkdir -p ai-loop-output
          node .github/ai-loop/cli.cjs claude-prompt
      - name: Require ANTHROPIC_API_KEY secret
        if: needs.gate.outputs.dry_run != 'true'
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not configured (see docs/automation/claude-codex-loop.md)"
            exit 1
          fi
      - name: Run Claude Code
        if: needs.gate.outputs.dry_run != 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model ${{ vars.CLAUDE_FIX_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --add-dir pr-head
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Task"
          show_full_output: false
          display_report: false
      - name: Restore held agent configuration and package Claude's edited tree (no git metadata)
        run: |
          cp -a "$RUNNER_TEMP/held/." pr-head/
          mkdir -p "$RUNNER_TEMP/claude-out"
          tar --exclude=.git -czf "$RUNNER_TEMP/claude-out/claude-tree.tgz" -C pr-head .
          if [ -f ai-loop-output/summary.md ]; then head -c 20000 ai-loop-output/summary.md > "$RUNNER_TEMP/claude-out/summary.md"; fi
          size=$(stat -c %s "$RUNNER_TEMP/claude-out/claude-tree.tgz")
          if [ "$size" -gt 52428800 ]; then echo "::error::edited tree is larger than 50 MB"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-loop-claude-out
          path: ${{ runner.temp }}/claude-out
          retention-days: 7

  verify-fix:
    name: Patch policy + verify (runs PR code; read-only, no secrets)
    needs: [gate, claude]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.claude.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      patch_ok: ${{ steps.check.outputs.patch_ok }}
      problems: ${{ steps.check.outputs.problems }}
      verify_ok: ${{ steps.verify.outputs.verify_ok }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: trusted
          sparse-checkout: .github/ai-loop
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-loop-claude-out
          path: ${{ runner.temp }}/claude-out
      - name: Overlay Claude's tree onto a pristine checkout
        env:
          PR_DIR: pr
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar --no-same-owner -xzf "$RUNNER_TEMP/claude-out/claude-tree.tgz" -C "$RUNNER_TEMP/tree"
          TREE_DIR="$RUNNER_TEMP/tree" node trusted/.github/ai-loop/cli.cjs overlay
      - name: Patch policy (first pass)
        id: check1
        env:
          PR_DIR: pr
          PATCH_FILE: ${{ runner.temp }}/fix.patch
        run: node trusted/.github/ai-loop/cli.cjs check-patch
      - name: Append verification record to the PR handoff
        if: steps.check1.outputs.changed == 'true' && steps.check1.outputs.patch_ok == 'true' && needs.gate.outputs.dry_run != 'true'
        env:
          PR_DIR: pr
          HANDOFF_PATH: ${{ needs.gate.outputs.handoff_path }}
          ROUND: ${{ needs.gate.outputs.round }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          REVIEW_COMMENT_URL: ${{ needs.gate.outputs.review_comment_url }}
          FILES: ${{ steps.check1.outputs.files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node trusted/.github/ai-loop/cli.cjs append-handoff
      - name: Patch policy (final)
        id: check
        env:
          PR_DIR: pr
          PATCH_FILE: ${{ runner.temp }}/fix-out/fix.patch
        run: |
          mkdir -p "$RUNNER_TEMP/fix-out"
          node trusted/.github/ai-loop/cli.cjs check-patch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.patch_ok == 'true' && needs.gate.outputs.dry_run != 'true'
        with:
          node-version: 22
      - name: npm ci && npm run verify with Claude's changes
        id: verify
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.patch_ok == 'true' && needs.gate.outputs.dry_run != 'true'
        working-directory: pr
        run: |
          set +e
          { npm ci && npm run verify; } > "$RUNNER_TEMP/fix-out/verify.log" 2>&1
          code=$?
          tail -n 60 "$RUNNER_TEMP/fix-out/verify.log"
          if [ "$code" -eq 0 ]; then echo "verify_ok=true" >> "$GITHUB_OUTPUT"; else echo "verify_ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.check.outputs.changed == 'true'
        with:
          name: ai-loop-fix-patch
          path: ${{ runner.temp }}/fix-out
          retention-days: 7

  push:
    name: Commit and push fix (contents:write; runs no PR code)
    needs: [gate, verify-fix]
    if: >-
      ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.gate.outputs.dry_run != 'true'
      && needs.verify-fix.outputs.changed == 'true' && needs.verify-fix.outputs.patch_ok == 'true'
      && needs.verify-fix.outputs.verify_ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_sha: ${{ steps.push.outputs.new_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: pr
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-loop-fix-patch
          path: ${{ runner.temp }}/fix
      - name: Apply, commit and push to the PR branch (fast-forward only)
        id: push
        env:
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          DEFAULT_BRANCH: ${{ needs.gate.outputs.default_branch }}
          BRANCH_PREFIX: ${{ needs.gate.outputs.branch_prefix }}
          ROUND: ${{ needs.gate.outputs.round }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          REVIEW_COMMENT_URL: ${{ needs.gate.outputs.review_comment_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then echo "::error::unsafe head ref"; exit 1; fi
          case "$HEAD_REF" in "$BRANCH_PREFIX"*) ;; *) echo "::error::refusing to push: branch lacks the loop prefix"; exit 1 ;; esac
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ] || [ "$HEAD_REF" = "main" ]; then echo "::error::refusing to push to the default branch"; exit 1; fi
          cd pr
          git -c core.hooksPath=/dev/null apply --index --whitespace=nowarn "$RUNNER_TEMP/fix/fix.patch"
          remote="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
          if [ "$remote" != "$HEAD_SHA" ]; then echo "::error::branch moved (${remote:-missing} != $HEAD_SHA); not pushing"; exit 1; fi
          printf '%s\n' \
            "AI loop: Claude fix round $ROUND for Codex review on PR #$PR_NUMBER" "" \
            "Automated fix by the RO-019 Claude <-> Codex loop; npm ci && npm run verify" \
            "passed before this commit was pushed." "" \
            "Review: $REVIEW_COMMENT_URL" "Workflow run: $RUN_URL" "" \
            "RepOne-AI-Loop: claude-fix round=$ROUND" \
            "Co-Authored-By: Claude <noreply@anthropic.com>" > "$RUNNER_TEMP/commit-msg.txt"
          git -c core.hooksPath=/dev/null \
              -c user.name='github-actions[bot]' \
              -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
              commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  report:
    name: Report, labels, re-review dispatch (no secrets, no PR code)
    needs: [gate, claude, verify-fix, push]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      issues: write
      actions: write # dispatch Codex re-review and CI
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: trusted
          sparse-checkout: .github/ai-loop
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: ai-loop-claude-out
          path: ${{ runner.temp }}/claude-out
      - name: Report outcome
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          DRY_RUN: ${{ needs.gate.outputs.dry_run }}
          CHAIN: ${{ needs.gate.outputs.chain }}
          ROUND: ${{ needs.gate.outputs.round }}
          REVIEW_COMMENT_ID: ${{ needs.gate.outputs.review_comment_id }}
          REVIEW_COMMENT_URL: ${{ needs.gate.outputs.review_comment_url }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          DEFAULT_BRANCH: ${{ needs.gate.outputs.default_branch }}
          CLAUDE_RESULT: ${{ needs.claude.result }}
          VERIFY_FIX_RESULT: ${{ needs.verify-fix.result }}
          CHANGED: ${{ needs.verify-fix.outputs.changed }}
          PATCH_OK: ${{ needs.verify-fix.outputs.patch_ok }}
          VERIFY_OK: ${{ needs.verify-fix.outputs.verify_ok }}
          PROBLEMS: ${{ needs.verify-fix.outputs.problems }}
          PUSH_RESULT: ${{ needs.push.result }}
          NEW_SHA: ${{ needs.push.outputs.new_sha }}
          SUMMARY_PATH: ${{ runner.temp }}/claude-out/summary.md
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { finishFix } = require(`${process.env.GITHUB_WORKSPACE}/trusted/.github/ai-loop/finish-fix.cjs`);
            await finishFix({ github, context, core });
