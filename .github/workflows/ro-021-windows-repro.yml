# RO-021 (temporary — removed again before review): reproduce RO-011 finding 1 (path separators in
# scripts/check-boundaries.mjs) on native Windows. Runs only on pushes to this branch and compares
# PR #3 before the fix (40d4a22, the commit Antigravity reviewed) with the fix (30e2dd3).
name: RO-021 Windows path reproduction (temporary)

on:
  push:
    branches: [claude/RO-021-windows-path-repro]

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.label }} ${{ matrix.short }} — Windows, Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: before-fix, short: 40d4a22, sha: 40d4a223dc117f36baa567ee9211db8d64daa2c5, node: 22 }
          - { label: after-fix, short: 30e2dd3, sha: 30e2dd3b53e71b1e97e6f7bf1dbaa9216c9bf5bb, node: 22 }
          - { label: after-fix, short: 30e2dd3, sha: 30e2dd3b53e71b1e97e6f7bf1dbaa9216c9bf5bb, node: 24 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm ci (commit under test)
        working-directory: target
        run: npm ci
      - name: Reproduce and report (annotations)
        run: node harness/.github/ro-021/windows-repro.mjs ${{ matrix.label }} target 30e2dd3b53e71b1e97e6f7bf1dbaa9216c9bf5bb
