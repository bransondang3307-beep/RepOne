# RO-021 (temporary — removed again before review): reproduce RO-011 finding 1 (path separators in
# scripts/check-boundaries.mjs) on native Windows. Runs only on pushes to this branch and compares
# PR #3 before the fix (40d4a22, the commit Antigravity reviewed) with the fix (now 6f48f1d).
name: RO-021 Windows path reproduction (temporary)

on:
  push:
    branches: [claude/RO-021-windows-path-repro]

permissions:
  contents: read

jobs:
  repro:
    name: ${{ matrix.label }} ${{ matrix.short }} — Windows, Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 1 (run 38933126592) covered 40d4a22 (before) and 30e2dd3 (test preload broke on Windows).
          - { label: after-fix, short: 6f48f1d, sha: 6f48f1da461842d00405103a991fe14394e00e75, node: 22 }
          - { label: after-fix, short: 6f48f1d, sha: 6f48f1da461842d00405103a991fe14394e00e75, node: 24 }
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm ci (commit under test)
        working-directory: target
        run: npm ci
      - name: Reproduce and report (annotations)
        run: node harness/.github/ro-021/windows-repro.mjs ${{ matrix.label }} target 6f48f1da461842d00405103a991fe14394e00e75
